mode:
  default: auto
locale: {}

# Raise the analysis-mode tool-call ceiling above the engine default (24) so
# complex multi-step questions finish without hitting the limit mid-turn.
# Effective only once the engine's get_tool_call_limit reader is deployed.
tool_call_limit: 40

prompt:
  # Generic seeknal workflow section (reports/pipelines/publishing) disabled —
  # irrelevant noise for the BPOM analyst; BPOM flow lives in SEEKNAL_ASK.md + skills.
  workflow: false
  custom: |
    You are a BPOM data analyst; follow the GATED procedure in SEEKNAL_ASK.md:
    CLASSIFY -> CLARIFY -> RESOLVE -> COMMIT -> EXECUTE -> VERIFY -> ANSWER.

    RESOLVE: open context/00-menghitung.md plus every topic page the question triggers, in ONE
    call. Load the skill with load_skill('bpom-analyst').

    ERLA-only repo. Query only t_produk_3_rilis_erla, t_btp_3_erla, m_trader_rla, data_dictionary --
    every other table has no grant; never name or query it. All ERLA columns are native
    (timestamp/bigint) -- write them as-is, never carry a cast from another schema.

    The budget counts logical steps: one final query is one step. Keep budget to answer.
    A failed gate stops the turn honestly; clarify only through request_clarification.
agent:
  ask_user:
    enabled: true
    auto_select: false
  request_clarification:
    enabled: true
  forecast:
    enabled: true
  anomaly:
    enabled: true
  upload_to_s3:
    enabled: true
  visualize_chart:
    enabled: true
    auto_emit: true

sources:
  warehouse:
    source_kind: connected
    source_type: database
    connector: postgresql
    namespace: warehouse
    access: read_only
    role: business_source_of_truth
    priority: 100
    context_sync:
      enabled: true
      refresh_policy: manual
      stale_after_hours: 24
      templates:
      - overview
      - columns
      - relationships
      - profiling
    dsn_env: WAREHOUSE_URL

# SQLR: send PG-only SQL straight to PostgreSQL. DuckDB's postgres_scanner
# never pushes aggregation down, so COUNT(DISTINCT ...) over an attached table
# pulls the raw column across the network first. Any failure on the routed
# path falls back to DuckDB, so this can change speed but never the answer.
sql_routing:
  pg_passthrough: true

agent_harness:
  # MS1: LLM sampling overrides. Default unset = provider default (~1.0), which
  # historically caused factual hallucination in BPOM answers (reversed
  # registration timeline, fabricated "Top 10 pabrik" lists). v4 variant set to
  # 0.5 as a middle ground between determinism and natural-language phrasing
  # -- lower than provider default to curb fabrication, higher than 0.0 to keep
  # answer prose readable. Tune based on observed output quality.
  model_settings:
    temperature: 0.5

  # Route pages are deliberately small (longest is 00-menghitung.md at ~124
  # lines) and skill files are loaded whole by the SkillsToolset, not through
  # read_project_file — so the default 200-line window never truncates any page
  # or skill. Kept at the engine default; no override needed.
  read_max_lines: 200

  auto_summarization:
    # ON so the deterministic history processors (microcompact +
    # sql_result_compactor) actually register — with enabled:false the engine
    # skips BOTH and every SQL result stays full-size in history, snowballing
    # tokens across a long turn. context_manager (LLM summarizer) stays off
    # for determinism.
    enabled: false
    context_manager: true
    context_manager_max_tokens: 800000
    summarization_model: "google-gla:gemini-2.0-flash"
    eviction_token_limit: 20000
    patch_tool_calls: true
    microcompact:
      enabled: false
      keep_recent_turns_analysis: 2
    sql_result_compactor:
      enabled: false
      min_chars_analysis: 250
  cost_tracking:
    enabled: true
  hooks:
    enabled: true
    sql_security: true
    sql_self_correction: true
  stuck_loop_detection:
    enabled: true
  subagents:
    enabled: auto
    include_builtin: true
    lineage_investigator: true
  teams:
    enabled: false
