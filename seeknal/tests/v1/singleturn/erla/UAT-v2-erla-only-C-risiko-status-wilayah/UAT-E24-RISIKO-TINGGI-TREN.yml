  - tidak tersedia|tidak ada|tidak memiliki|tidak dapat dihitung
  assert_any_of:
  - - ERBA
    - Tinggi
  - - ERLA
  tolerance_pct: 5
  assert_sql:
  - COUNT(DISTINCT nomor)
  - jenis_permohonan = '301'
  - jenis_dokumen='302'
  assert_sql_forbid:
  - COUNT(DISTINCT produk_id)
  note: 'KONDISI DATA (2026-09-23): hasil query ERLA tidak memiliki angka yang dekat dengan ekspektasi lama (populasi beda antar sistem). Ekspektasi: jawaban jujur. ERLA-only.'
