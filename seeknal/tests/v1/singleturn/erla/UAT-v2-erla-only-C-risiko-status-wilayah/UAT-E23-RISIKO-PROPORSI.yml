name: UAT_E23_RISIKO_PROPORSI
scenario_id: UAT-E23-RISIKO-PROPORSI
verification_date: '2026-09-22'
description: UAT-E23-RISIKO-PROPORSI — Proporsi risiko (kategori_dokumen); default ERBA, jangan tanya. ERLA-only.
turns:
- prompt: Untuk periode 2024-2025 dan permohonan baru, tampilkan proporsi tingkat Risiko Penilaian produk yang disetujui.
  assert_contains:
  - tidak tersedia|tidak ada|tidak memiliki|tidak dapat dihitung
  assert_any_of:
  - - Tinggi
  - - ERLA
  tolerance_pct: 5
  assert_sql:
  - COUNT(DISTINCT nomor)
  - tanggal_bayar
  - jenis_permohonan = '301'
  assert_sql_forbid:
  - COUNT(DISTINCT produk_id)
  note: 'KONDISI DATA (2026-09-23): SQL untuk kasus ini ERROR di ERLA (ERROR:  syntax error at or near "RISIKO"). Ekspektasi: jawaban jujur bahwa dimensi tidak tersedia, tanpa angka palsu. ERLA-only.'
