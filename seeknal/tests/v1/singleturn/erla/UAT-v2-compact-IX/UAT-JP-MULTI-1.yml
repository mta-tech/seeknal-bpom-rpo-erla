name: UAT_JP_MULTI_1
scenario_id: UAT-JP-MULTI-1
verification_date: '2026-09-23'
description: UAT-JP-MULTI-1 — multi-select dua segmen; namespace kode ERLA. ERLA-only.
turns:
- prompt: Berapa jumlah izin edar untuk Sosis Daging (0809) dan Udang Segar (0905)?
  assert_contains:
  - '2.435'
  assert_any_of:
  - - Sosis Daging
  - - ERLA
  tolerance_pct: 5
  note: 'NAMESPACE: kode 0809/0905 (dipakai panel ERBA) TIDAK ada di ERLA -> jenis_pangan IN (''0809'',''0905'') = 0; 0 itu "kode salah sistem", bukan "segmen tidak ada" (10-segmen-produk). Resolusi sisi ERLA (probe jenis_pangan/kategori_pangan): "Sosis Daging" -> kategori_pangan keluarga 080302xx / nama_kategori ''Sosis Daging%'' = 2.435 NIE (kategori_pangan 5 kode = 2.401); "Udang Segar" -> TIDAK ADA kategori bernama persis di ERLA (0) - tetangga terdekat keluarga perikanan kategori_pangan 0902. SATU IN-list, bukan dua query dijumlah; sebut himpunan nilai ERLA yang dipakai. Entity izin edar -> nomor. ERLA-only. CATATAN: di ERLA kode jenis_pangan 0809/0905 TIDAK ada (namespace beda) -> 0; angka 2.435 diperoleh lewat kategori_pangan/nama_kategori (Sosis Daging); Udang Segar tidak ada di ERLA.'
