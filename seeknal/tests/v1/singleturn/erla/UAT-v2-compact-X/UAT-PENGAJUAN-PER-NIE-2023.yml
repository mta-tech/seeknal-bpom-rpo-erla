name: UAT_PENGAJUAN_PER_NIE_2023
scenario_id: UAT-PENGAJUAN-PER-NIE-2023
verification_date: '2026-09-22'
description: 'UAT-PENGAJUAN-PER-NIE-2023 — P1/P3: satu NIE punya banyak pengajuan; hitung SEMUA NIE. ERLA-only.'
turns:
- prompt: untuk NIE yang terbit pada tahun 2023, ada berapa total pengajuan yang terkait dengannya?
  assert_contains:
  - '84.547'
  assert_any_of:
  - - 'pengajuan'
    - 'NIE'
  - - ERLA
  tolerance_pct: 5
  note: 'SQL: SELECT COUNT(DISTINCT nomor), COUNT(DISTINCT produk_id) FROM t_produk_3_rilis_erla WHERE nomor IN (SELECT nomor FROM t_produk_3_rilis_erla WHERE tanggal>=''2023-01-01'' AND tanggal<''2024-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''). DB 2026-09-22: NIE=16.004, pengajuan terkait=84.547. ATURAN (poin 1 & 3): satu NIE bisa punya BANYAK pengajuan (produk_id berawalan EREG…) — kalau produk punya dua NIE, gunakan SEMUA NIE yang ada, jangan pilih satu (00-menghitung §1, 15-permohonan). ERLA-only.'
