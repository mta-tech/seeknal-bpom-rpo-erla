description: 'UAT-BAYI-DICABUT-1 — formula bayi dicabut; hasil nol (anti-fabrikasi). ERLA-only.'
turns:
- prompt: apakah ada izin edar formula bayi yang dicabut atau dibatalkan BPOM?
  assert_contains:
  - '0'
  assert_any_of:
  - - 'Formula Bayi'
    - 'formula bayi'
    - 'tidak ditemukan'
    - 'tidak ada'
