  tolerance_pct: 5
  note: 'SQL: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE nama_kategori ILIKE ''Formula Bayi%'' AND status=''0009''; DB 2026-09-22: 0. Dictionary STATUS ERLA: ''0009'' = ''Dicabut/Dibatalkan''. Hasil 0 -> klaim ''tidak ditemukan'' TERKONFIRMASI. CATATAN SCOPE: bila memakai definisi longgar jenis_pangan IN (604,622,624) hasilnya >0, tetapi itu leakage dari Formula Pertumbuhan/MP-ASI/PKMK, bukan formula bayi. Sistem tidak boleh mengarang angka. Pembanding ERBA = 0.'
