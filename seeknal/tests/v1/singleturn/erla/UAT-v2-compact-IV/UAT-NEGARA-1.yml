  note: 'SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE negara_pabrik=''CN'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. DB 2026-09-22: ERLA=5.563 NIE. ATURAN: ''produk ... diproduksi'' = NIE terdaftar -> COUNT(DISTINCT nomor); kolom negara_pabrik (lokasi pabrik pembuat), BUKAN negara_produsen. Kode negara CN sama di kedua sistem (dictionary sumber ERLA dan ERBA). BEDA ERBA: pada filter sama ERBA ~11.250 (23Jul2026). Entity NIE. ERLA-only.'
