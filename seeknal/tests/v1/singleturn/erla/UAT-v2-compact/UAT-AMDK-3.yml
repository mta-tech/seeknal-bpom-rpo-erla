name: UAT_AMDK_3
scenario_id: UAT-AMDK-3
verification_date: '2026-09-22'
description: 'UAT-AMDK-3 — persetujuan produk AMDK 2024-2025; entity persetujuan = nomor, kolom tanggal. ERLA-only.'
turns:
- prompt: Tampilkan jumlah persetujuan produk AMDK pada tahun 2024 sampai 2025
  assert_contains:
  - '213'
  - '91'
  assert_any_of:
  - - 'AMDK'
    - '2024'
    - '2025'
  - - ERLA
  tolerance_pct: 5
  note: 'SQL: SELECT EXTRACT(YEAR FROM tanggal)::int th, COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE jenis_pangan IN (''651'',''652'',''655'') AND tanggal>=''2024-01-01'' AND tanggal<''2026-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>'''' GROUP BY 1 ORDER BY 1; DB 2026-09-22: 2024=213, 2025=91. ENTITY ''persetujuan/disetujui'' -> COUNT(DISTINCT nomor), kolom = tanggal (terbit NIE); TANPA filter jenis_permohonan (prompt tak menyebut ''baru''/''perubahan''). VARIAN (disebut di note, jangan dicampur): entity produk_id -> 265/105; bila difilter JP 301/303/304/305 -> 114/52. AMDK ERLA = jenis_pangan 651/652/655 (ERBA 1401/1402).'
