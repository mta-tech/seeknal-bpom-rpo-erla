description: UAT-AMDK-1 — NIE produk AMDK tahun 2023; entity nomor, kolom tanggal terbit. ERLA-only.
turns:
- prompt: Berapa jumlah NIE untuk produk AMDK pada tahun 2023?
  assert_contains:
  - '423'
  assert_any_of:
  - - AMDK
  - - ERLA
  tolerance_pct: 5
  note: 'SQL: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE jenis_pangan IN (''651'',''652'',''655'') AND tanggal>=''2023-01-01'' AND tanggal<''2024-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''; DB 2026-09-22: 9.127. ENTITY ''NIE'' -> COUNT(DISTINCT nomor); kolom tanggal terbit = tanggal (native timestamp, TANPA cast); TANPA filter jenis_permohonan (''jumlah NIE ... tahun'' bukan pemicu JP). BEDA KODE ERBA vs ERLA: AMDK di ERLA = jenis_pangan IN (''651'',''652'',''655''); ERBA memakai 1401/1402 - namespace terpisah, kode satu sistem tidak berlaku di sistem lain. Eksklusi trader_id<>3384; tier ERLA 4-kode (''0099'',''0999'',''0906'',''9999''). Pembanding ERBA 9.127 = 1.774 (di luar scope ERLA).'
