name: UAT_JP_TREN_1
scenario_id: UAT-JP-TREN-1
verification_date: '2026-09-22'
description: 'UAT-JP-TREN-1 — tren jenis permohonan dari tahun ke tahun; ERLA hampir beku sejak 2023. ERLA-only.'
turns:
- prompt: bagaimana tren jenis permohonan izin edar dari tahun ke tahun, apakah lebih banyak yang baru atau perubahan?
  assert_contains:
  - '99'
  - '17.752'
  assert_any_of:
  - - '2025'
    - 'perubahan'
  - - ERLA
  tolerance_pct: 5
  note: 'SQL ERLA: SELECT to_char(tanggal_bayar,''YYYY'') thn, jenis_permohonan, COUNT(DISTINCT produk_id) FROM t_produk_3_rilis_erla WHERE tanggal_bayar>=''2022-01-01'' AND tanggal_bayar<''2027-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 GROUP BY 1,2 ORDER BY 1,2. DB 2026-09-22: 2022 baru(301)=17.752 · mayor(302)=15.116 · minor(303)=10.161 · DU(304)=10.770 · notif(305)=1.694; 2023 301=1.079 · 302=8.451 · 303=8.871; 2024 301=203 · 302=5.078 · 303=5.955; 2025 301=99 · 302=2.278 · 303=2.988 · 305=10; 2026 301=5 · 302=328 · 303=645. ATURAN: JAWABAN TREN = tabel tahun x jenis permohonan dari SATU GROUP BY (bukan satu angka). Pola ERLA: permohonan BARU ambruk setelah 2022 (17.752 -> 1.079 -> 203 -> 99) dan isinya tinggal PERUBAHAN produk lama -> tanda migrasi ke sistem lain; sebutkan pembalikan ini. Entity permohonan = produk_id; kolom tanggal_bayar. 2026 parsial (s/d Sep) -> tandai. Kode 304 nyaris kosong. ERLA-only.'
