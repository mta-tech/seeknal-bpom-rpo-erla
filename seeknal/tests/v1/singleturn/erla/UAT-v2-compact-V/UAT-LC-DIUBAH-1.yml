description: UAT-LC-DIUBAH-1 — izin edar yang diperbarui dengan nomor baru (status 9999). ERLA-only.
turns:
- prompt: berapa izin edar yang sudah diperbarui dengan nomor baru di BPOM?
  assert_contains:
  - '78.704'
  assert_any_of:
  - - diubah
  - - ERLA
  tolerance_pct: 5
  note: 'SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE status=''9999'' AND trader_id<>3384 AND nomor<>''''. DB 2026-09-22: ERLA=78.704 NIE. ATURAN: status 9999 ''Sudah Diubah'' = penanda baris revisi/versi baru, BUKAN pencabutan dan BUKAN izin yang masih berlaku. Entity NIE = COUNT(DISTINCT nomor) — memakai produk_id akan menggelembung (ERLA produk_id ~205k karena satu NIE banyak revisi). BEDA ERBA: pada filter sama ERBA ~7.500 (27Jul2026); ERLA jauh lebih besar karena menampung riwayat revisi lebih panjang — pecah per domain agar tidak terbaca setara. ERLA-only.'
