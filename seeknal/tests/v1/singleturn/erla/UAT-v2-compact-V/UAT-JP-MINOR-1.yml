turns:
- prompt: berapa permohonan perubahan minor yang diterima di tahun 2023?
  assert_contains:
  - '6.484'
  assert_any_of:
  - - minor
    - '6.484'
  - - ERLA
  tolerance_pct: 5
  note: 'SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE jenis_permohonan=''303'' AND tanggal>=''2023-01-01'' AND tanggal<''2024-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. DB 2026-09-22: 6.484 NIE. ATURAN: ''diterima'' = cabang persetujuan -> entity nomor + kolom tanggal (terbit) + tier status sah (00-menghitung.md §1; 15-permohonan.md); tanggal native tanpa cast. Aturan ini sudah MEMUTUSKAN entity-nya, jadi BUKAN kasus klarifikasi (bukan dua bacaan materiil yang sama-sama hidup) -> assert_asked dihapus. JP 303 = Perubahan Minor (302 = Mayor, kode jangan tertukar). Pembanding bacaan pengajuan (produk_id + tanggal_bayar) = 8.871. ERLA-only.'
