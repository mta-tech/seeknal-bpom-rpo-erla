name: UAT_E15_NEGARA_SUSU_2024
scenario_id: UAT-E15-NEGARA-SUSU-2024
verification_date: '2026-09-22'
description: UAT-E15-NEGARA-SUSU-2024 — Segmen susu x negara asal (negara_pabrik ISO). ERLA-only.
turns:
- prompt: Untuk periode 2024 dan permohonan baru, tampilkan 10 negara asal terbanyak untuk produk yang disetujui untuk kategori susu olahan.
  assert_contains:
  - Indonesia
  - ID
  assert_any_of:
  - - '1.032'
    - '1.032'
  - - ERBA
  tolerance_pct: 5
  note: 'SQL ERLA: SELECT negara_pabrik, COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE nama_kategori ~* ''susu|whey|buttermilk'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>'''' GROUP BY 1 ORDER BY 2 DESC LIMIT 10. DB 2026-09-04 (all-time susu): ID=1.032, MY=61, CN=35, US=33, CH=32. Silang SEGMEN(nama_kategori susu) x negara_pabrik (ISO->nama; BUKAN negara_produsen yg 98% kosong). Terjemahkan ISO ke nama negara. ERLA-only.'
