  note: 'KONDISI DB 2026-09-07: TIDAK ADA kolom Balai/UPT/BBPOM/pengawasan di warehouse registrasi (0 kolom). JAWABAN SAH: nyatakan pengelompokan per BALAI tidak tersedia (data registrasi, bukan pengawasan), lalu jawab bagian yang BISA. AMBIGU ''di DKI'' -> DUA sisi sama sah, SEBUT sisi yang dipakai: PENDAFTAR (daerah_trader=31)=32.981 ATAU PABRIK (daerah_pabrik=31)=2.982 (risiko Tinggi kd IN 301,304, JP=301, 3 tahun terakhir). DILARANG mengarang balai. Entity NIE (COUNT DISTINCT nomor). ERLA-only.'
