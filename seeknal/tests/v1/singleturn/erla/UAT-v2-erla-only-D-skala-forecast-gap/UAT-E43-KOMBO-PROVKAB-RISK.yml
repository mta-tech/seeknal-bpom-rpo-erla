name: UAT_E43_KOMBO_PROVKAB_RISK
scenario_id: UAT-E43-KOMBO-PROVKAB-RISK
verification_date: '2026-09-22'
description: UAT-E43-KOMBO-PROVKAB-RISK — Kombinasi provinsi/kab x risiko x skala (JOIN). ERLA-only.
turns:
- prompt: Identifikasi Provinsi dan Kabupaten/Kota dengan kombinasi tertinggi untuk produk Risiko Tinggi dan Skala Mikro/IRTP, dalam periode 2025.
  assert_contains:
  - tidak tersedia|tidak ada|tidak memiliki|tidak dapat dihitung
  assert_any_of:
  - - ERLA
  tolerance_pct: 5
  assert_sql:
  - COUNT(DISTINCT nomor)
  - skala_industri_id = '1'
  - jenis_dokumen='302'
  assert_sql_forbid:
  - COUNT(DISTINCT produk_id)
  note: 'KONDISI DATA (2026-09-23): SQL untuk kasus ini ERROR di ERLA (ERROR:  syntax error at or near "."). Ekspektasi: jawaban jujur bahwa dimensi tidak tersedia, tanpa angka palsu. ERLA-only.'
