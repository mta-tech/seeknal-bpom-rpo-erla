  note: 'SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE kategori_pangan LIKE ''12010103%'' AND tanggal>=''61-01-01'' AND tanggal<''2024-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. DB 2026-09-22: 61. Segmen "garam beryodium" di ERLA TIDAK memakai namespace jenis_pangan 1204 (itu ERBA); anchor ERLA = kategori_pangan ''12010103'' = "Garam Konsumsi Beriodium" (11-kode-segmen). Entity NIE = COUNT(DISTINCT nomor) + tanggal (terbit), BUKAN tanggal_bayar (00-menghitung). Cakupan lebih lebar nama_kategori ILIKE ''%garam%'' (ikut bumbu) = 62 -> pakai anchor presisi. ERLA-only; nyatakan batas domain.'
