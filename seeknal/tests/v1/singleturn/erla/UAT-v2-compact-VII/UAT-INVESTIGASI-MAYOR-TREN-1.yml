verification_date: '2026-09-22'
description: 'UAT-INVESTIGASI-MAYOR-TREN-1 — tren perubahan mayor (JP 302) 2023-2025. ERLA-only.'
turns:
- prompt: kenapa jumlah perubahan mayor izin edar terus meningkat drastis dalam 3 tahun terakhir?
  assert_contains:
  - '2023'
  - '2025'
  - mayor
  assert_any_of:
  - - '8.451'
    - '5.078'
    - '2.278'
  - - ERLA
  tolerance_pct: 10
  note: 'SQL ERLA: SELECT EXTRACT(YEAR FROM tanggal_bayar)::int th, COUNT(DISTINCT produk_id) FROM t_produk_3_rilis_erla WHERE jenis_permohonan=''302'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND tanggal_bayar>=''2023-01-01'' AND tanggal_bayar<''2026-01-01'' GROUP BY 1 ORDER BY 1. DB 2026-09-22: 2023=8.451 | 2024=5.078 | 2025=2.278 (entity permohonan = produk_id + tanggal_bayar; 15-permohonan). PREMIS PROMPT TIDAK BERLAKU DI ERLA: di sisi ERLA perubahan mayor MENURUN tajam (8.451 -> 5.078 -> 2.278, arah berkebalikan), bukan meningkat. Jawaban benar menyatakan tren MENURUN di ERLA + sebab yang didukung data (ERLA beku / migrasi ke sistem baru), bukan mengarang kenaikan. ERLA-only.'
