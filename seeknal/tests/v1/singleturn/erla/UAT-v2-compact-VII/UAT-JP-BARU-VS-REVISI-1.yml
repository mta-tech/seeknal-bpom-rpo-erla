  note: 'SQL ERLA: SELECT jenis_permohonan, COUNT(DISTINCT produk_id) FROM t_produk_3_rilis_erla WHERE jenis_permohonan IN (''301'',''305'',''302'',''303'') AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND tanggal_bayar>=''2025-01-01'' AND tanggal_bayar<''2026-01-01'' GROUP BY 1. DB 2026-09-22: 301=99 | 305=10 | 302=2.278 | 303=2.988. Baru (301+305)=109; revisi (302+303)=5.266. DI ERLA REVISI JAUH LEBIH BANYAK (rasio ~1:48) - kebalikan ERBA: sistem lama menyimpan riwayat revisi panjang sedangkan pendaftaran baru pindah ke sistem baru. Entity permohonan ("daftar") = produk_id + tanggal_bayar; sebut 304 sbg kelompok yang tak masuk kedua sisi. ERLA-only.'
