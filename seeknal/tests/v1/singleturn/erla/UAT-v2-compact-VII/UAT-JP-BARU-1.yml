  note: 'SQL ERLA: SELECT COUNT(DISTINCT nomor) FROM t_produk_3_rilis_erla WHERE jenis_permohonan IN (''301'',''305'') AND tanggal>=''2023-01-01'' AND tanggal<''2024-01-01'' AND status IN (''0099'',''0999'',''0906'',''9999'') AND trader_id<>3384 AND nomor<>''''. DB 2026-09-22: 2.642 NIE. ATURAN: ''disetujui'' -> entity nomor + kolom tanggal (terbit) + tier status sah (00-menghitung.md §1; 15-permohonan.md); ''baru'' = 301 (+305 notifikasi, aturan batch ini; 305 jalur notifikasi terpisah). Pembanding bacaan pengajuan (produk_id + tanggal_bayar) = 1.123 (301+305) / 1.079 (301-saja); nilai kanonik lama ERLA (produk_id) = 1.079. ERLA-only.'
