turns:
- prompt: siapa perusahaan yang paling banyak produknya terdaftar di BPOM?
  assert_contains:
  - 'INTERFOOD'
  - '2.704'
  assert_any_of:
  - - 'perusahaan'
    - 'trader'
  - - ERLA
