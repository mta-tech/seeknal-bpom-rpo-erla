name: REG_16_GELATO_KLASIFIKASI
scenario_id: REG-16-GELATO-KLASIFIKASI
verification_date: '2026-09-15'
description: 'REG-16 — Klasifikasi gelato tanpa susu (01.7 vs 02.4). Definisional, dikunci tanpa SQL.'
turns:
- prompt: 'Kalau ada produk gelato yang jelas tanpa susu, itu masuk kategori es krim yang mana?'
  assert_contains:
  - '02.4'
  assert_any_of:
  - - 'non-dairy'
  - - 'Melorin'
  - - '01.7'
  assert_asked: false
  assert_no_sql: true
  note: 'Sumber: 04a-takaran-saji-susu-es.md bagian klasifikasi. Kode 01.7 = kategori berbasis susu (Es Krim Susu/Dairy Ice Cream, Es Krim, Es Susu); kode 02.4 = Makanan Pencuci Mulut Berbasis Lemak, BUKAN berbasis susu (Melorin/Non-Dairy Ice Cream). Kata gelato TIDAK muncul di PerBPOM 10/2026 — pemetaannya ke es krim adalah keputusan klasifikasi. Kesimpulan yang sah = kandidat ketidaksesuaian klasifikasi 01.7 vs 02.4 bila dipasarkan sebagai es krim, BUKAN vonis pelanggaran. Jawaban murni klasifikasi dari regulasi. assert_no_sql=true menutup celah lama: bila model menjalankan SQL lalu tidak melengkapi chart/export, kini FAIL. Sisi cross-check data ada di suite lintas (REG-X-14) yang memang boleh berdata.'
