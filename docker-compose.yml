# ERLA — worker saja. Engine IBA cukup SATU di host ini, didefinisikan di
# docker-compose ERBA (container: iba-dev-engine, ikut jaringan serving_network).
# Worker ERLA mengakses engine lewat nama kontainer:
#   IBA_ENGINE_URL=http://iba-dev-engine:8000   (lihat .env.worker)
services:
  seeknal-worker:
    image: ${SEEKNAL_WORKER_IMAGE:-ghcr.io/mta-tech/seeknal-worker:2.9.5}
    container_name: seeknal-worker-bpom-erla
    restart: unless-stopped
    pull_policy: always
    working_dir: /app/project
    env_file:
      - path: .env
        required: false
      - path: .env.worker
        required: true
    environment:
      SEEKNAL_PROJECT_PATH: /app/project
      SEEKNAL_WORKER_TRANSPORT: http
    extra_hosts:
      - "host.docker.internal:host-gateway"   # fallback: http://host.docker.internal:6805
    volumes:
      - type: bind
        source: /home/cbnpom/seeknal-bpom-rpo-erla
        target: /app/project
    command: ["--project", "/app/project", "--transport", "http", "--max-concurrency", "20"]
networks:
  default:
    external: true
    name: serving_network
